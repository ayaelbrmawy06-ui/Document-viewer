<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>عارض المستندات</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C2333">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="عارض المستندات">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#1C2333;
    --navy-2:#242C40;
    --surface:#E8E5DE;
    --paper:#FFFFFF;
    --teal:#3D7A6E;
    --teal-light:#4F9587;
    --text:#1C2333;
    --muted:#6B7280;
    --line:#D7D3C8;
    --danger:#B4452F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
    background:var(--surface);
    color:var(--text);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
  @font-face{
    font-family:'IBM Plex Sans Arabic';
    src:local('Segoe UI');
  }

  /* Top bar */
  header{
    background:var(--navy);
    color:#fff;
    padding:14px 20px;
    display:flex;
    align-items:center;
    gap:16px;
    flex-shrink:0;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  header h1{
    font-size:16px;
    font-weight:600;
    margin:0;
    letter-spacing:0.2px;
    flex-shrink:0;
  }
  .toolbar{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    flex:1;
  }
  .btn{
    background:var(--navy-2);
    color:#fff;
    border:1px solid rgba(255,255,255,0.12);
    padding:7px 14px;
    border-radius:6px;
    font-size:13px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    transition:background 0.15s ease;
    font-family:inherit;
  }
  .btn:hover{background:var(--teal);border-color:var(--teal);}
  .btn:disabled{opacity:0.35;cursor:not-allowed;}
  .btn:disabled:hover{background:var(--navy-2);}
  .btn.primary{background:var(--teal);border-color:var(--teal);}
  .btn.primary:hover{background:var(--teal-light);}
  input[type=file]{display:none;}
  .page-info{
    color:#C9CCD6;
    font-size:13px;
    min-width:70px;
    text-align:center;
  }
  .zoom-info{color:#C9CCD6;font-size:13px;min-width:44px;text-align:center;}

  /* Body layout */
  .layout{
    flex:1;
    display:flex;
    overflow:hidden;
  }

  /* Sidebar */
  aside{
    width:220px;
    background:var(--navy);
    color:#fff;
    flex-shrink:0;
    overflow-y:auto;
    border-left:1px solid rgba(255,255,255,0.08);
    padding:14px 10px;
  }
  aside h2{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.8px;
    color:#8B93A7;
    margin:6px 8px 10px;
    font-weight:600;
  }
  .file-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 10px;
    border-radius:6px;
    font-size:13px;
    cursor:pointer;
    margin-bottom:3px;
    color:#D6D9E2;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .file-item:hover{background:var(--navy-2);}
  .file-item.active{background:var(--teal);color:#fff;}
  .file-icon{
    width:22px;height:22px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    border-radius:4px;font-size:10px;font-weight:700;
  }
  .file-icon.pdf{background:#B4452F;}
  .file-icon.xlsx{background:#1D7A4C;}
  .file-icon.csv{background:#3D7A6E;}

  /* Main area */
  main{
    flex:1;
    overflow:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px;
  }
  .empty-state{
    margin:auto;
    text-align:center;
    color:var(--muted);
    max-width:340px;
  }
  .empty-state .mark{
    width:64px;height:64px;
    border:2px solid var(--line);
    border-radius:10px;
    margin:0 auto 18px;
    display:flex;align-items:center;justify-content:center;
    font-size:26px;
    color:var(--teal);
    background:var(--paper);
  }
  .empty-state p{font-size:14px;line-height:1.7;margin:6px 0 0;}
  .empty-state .browse{color:var(--teal);cursor:pointer;text-decoration:underline;font-weight:600;}

  #pdf-canvas-wrap{
    background:var(--paper);
    box-shadow:0 2px 14px rgba(28,35,51,0.15);
  }
  canvas{display:block;}

  /* Excel table view */
  .sheet-wrap{
    background:var(--paper);
    width:100%;
    max-width:1000px;
    box-shadow:0 2px 14px rgba(28,35,51,0.15);
    border-radius:4px;
    overflow:hidden;
  }
  .sheet-tabs{
    display:flex;
    gap:2px;
    background:var(--surface);
    padding:8px 8px 0;
    overflow-x:auto;
  }
  .sheet-tab{
    padding:8px 16px;
    font-size:12.5px;
    background:var(--paper);
    border-radius:6px 6px 0 0;
    cursor:pointer;
    color:var(--muted);
    white-space:nowrap;
  }
  .sheet-tab.active{color:var(--text);font-weight:600;box-shadow:0 -1px 0 var(--teal) inset;}
  table.data{
    border-collapse:collapse;
    width:100%;
    font-size:12.5px;
  }
  table.data th, table.data td{
    border:1px solid var(--line);
    padding:6px 10px;
    text-align:right;
    white-space:nowrap;
  }
  table.data th{
    background:var(--surface);
    position:sticky;
    top:0;
    font-weight:600;
    color:var(--navy);
  }
  table.data tr:nth-child(even) td{background:#FAFAF7;}
  .table-scroll{max-height:70vh;overflow:auto;}

  .loading{color:var(--muted);margin:auto;font-size:13px;}
  .error-box{
    margin:auto;
    color:var(--danger);
    background:#FBEAE6;
    border:1px solid #EBC4BA;
    padding:14px 18px;
    border-radius:8px;
    font-size:13px;
    max-width:360px;
    text-align:center;
  }
</style>
</head>
<body>

<header>
  <h1>عارض المستندات</h1>
  <div class="toolbar" id="toolbar">
    <button class="btn primary" onclick="document.getElementById('fileInput').click()">📂 فتح ملف</button>
    <input type="file" id="fileInput" accept=".pdf,.xlsx,.xls,.csv" multiple>
    <span id="pdfControls" style="display:none;align-items:center;gap:10px;">
      <button class="btn" id="prevPage">◀ السابقة</button>
      <span class="page-info" id="pageInfo">- / -</span>
      <button class="btn" id="nextPage">التالية ▶</button>
      <button class="btn" id="zoomOut">−</button>
      <span class="zoom-info" id="zoomInfo">100%</span>
      <button class="btn" id="zoomIn">+</button>
    </span>
  </div>
</header>

<div class="layout">
  <aside>
    <h2>الملفات المفتوحة</h2>
    <div id="fileList"></div>
  </aside>

  <main id="mainArea">
    <div class="empty-state" id="emptyState">
      <div class="mark">📄</div>
      <p>لسه معندكش ملف مفتوح.</p>
      <p>اسحب ملف PDF أو Excel هنا، أو <span class="browse" onclick="document.getElementById('fileInput').click()">اختار ملف من جهازك</span></p>
    </div>
  </main>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const fileInput = document.getElementById('fileInput');
const fileListEl = document.getElementById('fileList');
const mainArea = document.getElementById('mainArea');
const emptyState = document.getElementById('emptyState');
const pdfControls = document.getElementById('pdfControls');
const pageInfo = document.getElementById('pageInfo');
const zoomInfo = document.getElementById('zoomInfo');

let files = {};      // id -> {name, type, data (arraybuffer or workbook)}
let activeId = null;
let currentPdfDoc = null;
let currentPage = 1;
let currentZoom = 1.2;
let idCounter = 0;

fileInput.addEventListener('change', (e) => {
  for (const f of e.target.files) addFile(f);
  fileInput.value = '';
});

// Drag & drop
mainArea.addEventListener('dragover', (e) => { e.preventDefault(); });
mainArea.addEventListener('drop', (e) => {
  e.preventDefault();
  for (const f of e.dataTransfer.files) addFile(f);
});

function extOf(name){
  const parts = name.split('.');
  return parts[parts.length-1].toLowerCase();
}

function addFile(file){
  const ext = extOf(file.name);
  let type = null;
  if(ext === 'pdf') type = 'pdf';
  else if(ext === 'xlsx' || ext === 'xls') type = 'xlsx';
  else if(ext === 'csv') type = 'csv';
  else { alert('نوع الملف غير مدعوم: ' + file.name); return; }

  const id = 'f' + (++idCounter);
  const reader = new FileReader();
  reader.onload = (e) => {
    files[id] = { name: file.name, type, buffer: e.target.result };
    renderFileList();
    openFile(id);
  };
  reader.onerror = () => alert('تعذر قراءة الملف: ' + file.name);
  reader.readAsArrayBuffer(file);
}

function renderFileList(){
  fileListEl.innerHTML = '';
  Object.entries(files).forEach(([id, f]) => {
    const item = document.createElement('div');
    item.className = 'file-item' + (id === activeId ? ' active' : '');
    item.onclick = () => openFile(id);
    const iconLabel = f.type === 'pdf' ? 'PDF' : (f.type === 'xlsx' ? 'XLS' : 'CSV');
    item.innerHTML = `<span class="file-icon ${f.type}">${iconLabel}</span><span>${f.name}</span>`;
    fileListEl.appendChild(item);
  });
}

async function openFile(id){
  activeId = id;
  renderFileList();
  const f = files[id];
  emptyState.style.display = 'none';

  if(f.type === 'pdf'){
    pdfControls.style.display = 'flex';
    await openPdf(f);
  } else {
    pdfControls.style.display = 'none';
    openSheet(f);
  }
}

// ---------- PDF handling ----------
async function openPdf(f){
  mainArea.innerHTML = '<div class="loading">جاري تحميل الملف…</div>';
  try{
    const loadingTask = pdfjsLib.getDocument({ data: f.buffer.slice(0) });
    currentPdfDoc = await loadingTask.promise;
    currentPage = 1;
    currentZoom = 1.2;
    renderPdfPage();
  }catch(err){
    mainArea.innerHTML = '<div class="error-box">تعذر فتح ملف الـ PDF. جرّبي ملف تاني.</div>';
  }
}

async function renderPdfPage(){
  if(!currentPdfDoc) return;
  const page = await currentPdfDoc.getPage(currentPage);
  const viewport = page.getViewport({ scale: currentZoom });

  const wrap = document.createElement('div');
  wrap.id = 'pdf-canvas-wrap';
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  wrap.appendChild(canvas);
  mainArea.innerHTML = '';
  mainArea.appendChild(wrap);

  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport }).promise;

  pageInfo.textContent = `${currentPage} / ${currentPdfDoc.numPages}`;
  zoomInfo.textContent = Math.round(currentZoom / 1.2 * 100) + '%';
  document.getElementById('prevPage').disabled = currentPage <= 1;
  document.getElementById('nextPage').disabled = currentPage >= currentPdfDoc.numPages;
}

document.getElementById('prevPage').onclick = () => {
  if(currentPage > 1){ currentPage--; renderPdfPage(); }
};
document.getElementById('nextPage').onclick = () => {
  if(currentPdfDoc && currentPage < currentPdfDoc.numPages){ currentPage++; renderPdfPage(); }
};
document.getElementById('zoomIn').onclick = () => { currentZoom = Math.min(currentZoom + 0.2, 3); renderPdfPage(); };
document.getElementById('zoomOut').onclick = () => { currentZoom = Math.max(currentZoom - 0.2, 0.5); renderPdfPage(); };

// ---------- Excel / CSV handling ----------
function openSheet(f){
  mainArea.innerHTML = '<div class="loading">جاري تحميل الجدول…</div>';
  try{
    let workbook;
    if(f.type === 'csv'){
      const text = new TextDecoder('utf-8').decode(f.buffer);
      workbook = XLSX.read(text, { type: 'string' });
    } else {
      workbook = XLSX.read(f.buffer, { type: 'array' });
    }
    renderWorkbook(workbook);
  }catch(err){
    mainArea.innerHTML = '<div class="error-box">تعذر فتح الملف. اتأكدي إنه ملف Excel أو CSV سليم.</div>';
  }
}

function renderWorkbook(workbook){
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';

  const tabs = document.createElement('div');
  tabs.className = 'sheet-tabs';
  const scrollDiv = document.createElement('div');
  scrollDiv.className = 'table-scroll';

  function showSheet(name){
    scrollDiv.innerHTML = htmlTableFromSheet(workbook.Sheets[name]);
    [...tabs.children].forEach(t => t.classList.toggle('active', t.textContent === name));
  }

  workbook.SheetNames.forEach((name) => {
    const tab = document.createElement('div');
    tab.className = 'sheet-tab';
    tab.textContent = name;
    tab.onclick = () => showSheet(name);
    tabs.appendChild(tab);
  });

  wrap.appendChild(tabs);
  wrap.appendChild(scrollDiv);
  mainArea.innerHTML = '';
  mainArea.appendChild(wrap);

  showSheet(workbook.SheetNames[0]);
}

function htmlTableFromSheet(sheet){
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
  if(rows.length === 0) return '<p style="padding:16px;color:#6B7280;">الجدول فاضي.</p>';
  let html = '<table class="data"><thead><tr>';
  rows[0].forEach(cell => html += `<th>${escapeHtml(String(cell))}</th>`);
  html += '</tr></thead><tbody>';
  for(let i=1;i<rows.length;i++){
    html += '<tr>';
    rows[i].forEach(cell => html += `<td>${escapeHtml(String(cell))}</td>`);
    html += '</tr>';
  }
  html += '</tbody></table>';
  return html;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
